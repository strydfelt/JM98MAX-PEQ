name: Build PEQ Configurator

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  PROJECT_ROOT: ./peq_configurator

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'uv'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest pytest-cov

      - name: Run tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./peq_configurator/coverage.xml
          fail_ci_if_error: false

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'uv'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          uv pip install -r requirements.txt
          uv pip install pyinstaller

      - name: Build Windows executable
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python build.py --platform windows --output build_artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PEQConfigurator-Windows
          path: ${{ env.PROJECT_ROOT }}/build_artifacts/windows/*.exe
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'uv'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install uv dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          uv pip install -r requirements.txt
          uv pip install buildozer

      - name: Build Android (debug)
        working-directory: ${{ env.PROJECT_ROOT }}
        if: github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch'
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android debug

      - name: Build Android (release)
        working-directory: ${{ env.PROJECT_ROOT }}
        if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
        run: |
          export BUILDOZER_WARN_ON_ROOT=1
          buildozer -v android release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PEQConfigurator-Android
          path: |
            ${{ env.PROJECT_ROOT }}/bin/*.apk
            ${{ env.PROJECT_ROOT }}/bin/*.aab
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PEQConfigurator-Windows
          path: ./release/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: PEQConfigurator-Android
          path: ./release/android

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release/windows/*.exe
            ./release/android/*.apk
            ./release/android/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}